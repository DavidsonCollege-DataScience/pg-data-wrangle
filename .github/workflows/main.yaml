name: Continuous Integration

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rocker/verse:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # - name: Install system dependencies
      #   run: |
      #     apt-get update
      #     apt-get install -y libglpk-dev libglpk40 python3-venv python3-pip python3-dev
      # - name: Install R packages
      #   run: |
      #     Rscript -e "options(repos = c(CRAN = sprintf('https://packagemanager.posit.co/cran/2025-09-30/bin/linux/noble-%s/%s', R.version['arch'], substr(getRversion(), 1, 3)))); install.packages(c('DBI','connections','RPostgres','WDI','googlesheets4','gt','highcharter','scales','reticulate','keras3'), dependencies = TRUE)"
      # - name: Install TinyTex
      #   run: |
      #     quarto install tinytex
      - name: Render website
        run: |
          quarto render --profile release --cache-refresh

      - name: Upload artifact for publish job
        uses: actions/upload-artifact@v4
        with:
          name: site_build
          path: docs

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Get artifact
        uses: actions/download-artifact@v5
        with:
          name: site_build
          path: build

      # datasci.davidson.edu is a shared Azure Static Web App; only the
      # DavidsonCollege-DataScience/datasci-hub repo deploys to it directly
      # (each repo deploying straight to Azure would clobber the others'
      # paths, since SWA deploys always fully replace the app's content).
      # So publish our rendered output into hub/datawrangle/ instead, and
      # let the hub's own deploy workflow pick it up alongside datafest and
      # datacats. See that repo's README for the full architecture.
      - name: Checkout datasci-hub
        uses: actions/checkout@v4
        with:
          repository: DavidsonCollege-DataScience/datasci-hub
          token: ${{ secrets.HUB_REPO_PUSH_TOKEN }}
          path: hub

      - name: Sync build output into hub's /datawrangle
        run: |
          rsync -a --delete build/ hub/datawrangle/
          cd hub
          git config user.name "pg-data-wrangle-site CI"
          git config user.email "actions@users.noreply.github.com"
          git add datawrangle
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Publish pg-data-wrangle-site@${GITHUB_SHA}"
            git push
          fi
