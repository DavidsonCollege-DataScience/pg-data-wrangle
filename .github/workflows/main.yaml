name: Continuous Integration

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rocker/verse:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      # - name: Install system dependencies
      #   run: |
      #     apt-get update
      #     apt-get install -y libglpk-dev libglpk40 python3-venv python3-pip python3-dev
      # - name: Install R packages
      #   run: |
      #     Rscript -e "options(repos = c(CRAN = sprintf('https://packagemanager.posit.co/cran/2025-09-30/bin/linux/noble-%s/%s', R.version['arch'], substr(getRversion(), 1, 3)))); install.packages(c('DBI','connections','RPostgres','WDI','googlesheets4','gt','highcharter','scales','reticulate','keras3'), dependencies = TRUE)"
      # - name: Install TinyTex
      #   run: |
      #     quarto install tinytex
      - name: Render website
        run: |
          quarto render --profile release --cache-refresh
      # - name: Copy Static App Config to Output
      #   run: |
      #     cp -vf staticwebapp.config.json docs/staticwebapp.config.json
      - name: Output folder directories
        run: ls

      - name: Upload artifact for deploy job
        uses: actions/upload-artifact@v4
        with:
            name: site_deployment
            path: docs

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Get artifact
        uses: actions/download-artifact@v5
        with:
          name: site_deployment

      - name: Deploy to Azure
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "/datawrangle"
          output_location: "/docs"